title: Timestomping - File Modification Time Set to the Past
id: 4dbb4759-bfe6-41ce-94b5-7f17ca2421e6
status: experimental
description: >
    Detects a file whose last-modification time is changed to a point
    well in the past (timestomping). The training command-logger backdates
    its output files by 30-180 days to make them blend in with old system
    files and defeat "sort by date" triage. Sysmon Event ID 2 fires when a
    process explicitly sets a file's creation/modification time.
references:
    - https://attack.mitre.org/techniques/T1070/006/
    - Internal project: Detection Engineering Lab (command_logger / detector)
author: Hisham Zarour
date: 2026-11-17
logsource:
    product: windows
    category: file_change        # Sysmon Event ID 2
detection:
    selection:
        Image|endswith:
            - '\python.exe'
            - '\pythonw.exe'
    # A modification timestamp set to the past relative to "now" is the
    # anomaly. In most SIEMs this is expressed as a field comparison; here
    # we flag the interpreter performing a SetFileTime at all, which the
    # logger must do to backdate its files, then tune on the time delta.
    condition: selection
falsepositives:
    - Build tools and installers that legitimately preserve archive timestamps
    - Backup/restore and sync software (e.g. rsync, robocopy /COPY:T)
level: medium
tags:
    - attack.defense-evasion
    - attack.t1070.006
